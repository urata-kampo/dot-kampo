<body>
<style>
:root{
  color-scheme: dark;
  --bg:#0c0c14; --panel:#000; --line:#fcfcfc; --text:#fcfcfc; --dim:#a8a8b8;
  --gold:#f8b800; --red:#f83800; --green:#58d854; --blue:#3cbcfc; --pink:#f878f8; --brown:#ac7c00;
  --font:"DotGothic16","Hiragino Kaku Gothic ProN","Yu Gothic","MS Gothic",monospace;
}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;padding-inline:max(16px,env(safe-area-inset-left));padding-block:max(12px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-bottom));-webkit-font-smoothing:none}
*{box-sizing:border-box}
#game{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#hud{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:13px}
.hud-cell{border:2px solid var(--line);background:var(--panel);padding:2px 6px;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.hud-cell b{font-weight:normal;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-cell span{font-size:11px;color:var(--dim)}
#screenwrap{position:relative;border:4px solid var(--line);box-shadow:0 0 0 4px #000, 0 0 0 6px #555;background:#000}
#scene{display:block;width:100%;aspect-ratio:256/160;image-rendering:pixelated;image-rendering:crisp-edges}
#toolbar{position:absolute;bottom:4px;left:4px;display:flex;gap:4px}
#toolbar button{font-size:11px;padding:1px 6px;border-width:2px}
.box{background:var(--panel);border:3px double var(--line);outline:2px solid #000;padding:10px 12px;position:relative}
#panel{min-height:230px;display:flex;flex-direction:column;gap:8px}
.speaker{color:var(--gold);font-size:13px}
.msg{white-space:pre-wrap;min-height:3.2em}
.row{display:flex;flex-wrap:wrap;gap:6px}
button{font-family:var(--font);font-size:14px;background:#000;color:var(--text);border:2px solid var(--line);padding:6px 10px;cursor:pointer;line-height:1.3}
button:hover:not(:disabled),button:focus-visible{background:#fcfcfc;color:#000;outline:none}
button:disabled{opacity:.35;cursor:not-allowed}
button.primary{border-color:var(--gold);color:var(--gold)}
button.primary:hover:not(:disabled){background:var(--gold);color:#000}
button.danger{border-color:var(--red);color:#fc7460}
button.danger:hover:not(:disabled){background:var(--red);color:#fff}
button.sel::before{content:"▶";color:var(--gold);margin-right:4px}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.karte{border:2px dashed #7c7c7c;padding:6px 8px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.karte .k{color:var(--blue)}
.hearts{color:var(--red);letter-spacing:2px}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tabs button{font-size:12px;padding:3px 7px}
.tabs button.on{background:var(--gold);color:#000;border-color:var(--gold)}
.list{display:flex;flex-direction:column;gap:4px;max-height:300px;overflow-y:auto;padding-right:4px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 8px;text-align:left;padding:6px 8px;font-size:13px}
.item .nm{font-size:15px}
.item .rd{font-size:11px;color:var(--dim)}
.item .ds{grid-column:1/-1;color:#d8d8d8;font-size:12px}
.item:hover .ds,.item:focus-visible .ds,.item:hover .rd,.item:focus-visible .rd{color:#333}
.badge{display:inline-block;font-size:10px;padding:0 3px;border:1px solid currentColor;margin-left:3px;vertical-align:1px}
.b-kan{color:#fcb8b8}.b-mao{color:#b8b8f8}.b-dai{color:#d8f878}.b-bu{color:#fcd8a8}.b-nin{color:#f878f8}
input[type=text]{font-family:var(--font);font-size:18px;background:#000;color:var(--gold);border:2px solid var(--line);padding:6px 10px;width:100%;max-width:320px}
input[type=text]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.stock{font-variant-numeric:tabular-nums;font-size:12px;text-align:right;white-space:nowrap}
.stock.zero{color:var(--red)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
td,th{padding:3px 4px;border-bottom:1px dotted #555;text-align:left;font-weight:normal}
td.n{text-align:right;white-space:nowrap}
tr.total td{border-top:2px solid var(--line);color:var(--gold)}
tr.sub td{color:var(--dim);font-size:12px}
.minus{color:#fc7460}.plus{color:var(--green)}
.good{color:var(--green)}.bad{color:#fc7460}.warn{color:var(--gold)}
.small{font-size:12px;color:var(--dim)}
.order-row{display:grid;grid-template-columns:1fr auto auto auto auto;align-items:center;gap:6px;font-size:13px;padding:3px 0;border-bottom:1px dotted #444}
.order-row button{padding:0 8px;font-size:14px}
.order-row .q{min-width:2.2em;text-align:center;font-variant-numeric:tabular-nums;color:var(--gold)}
.center{text-align:center}
h2{font-size:18px;font-weight:normal;color:var(--gold);margin:0}
h3{font-size:15px;font-weight:normal;color:var(--blue);margin:6px 0 2px}
p{margin:0}
.scroll{max-height:340px;overflow-y:auto;padding-right:4px;display:flex;flex-direction:column;gap:6px}
.blink{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.blink{animation:none}}
@media (max-width:440px){
  body{font-size:14px}
  #hud{grid-template-columns:repeat(2,1fr)}
  .qgrid{grid-template-columns:1fr}
  .order-row{grid-template-columns:1fr auto auto auto;}
  .order-row .rd{display:none}
}
</style>

</div>

function beep(freq=660,dur=0.05,type="square",vol=0.04){
  if(!sound) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type;o.frequency.value=freq;g.gain.value=vol;
    o.connect(g);g.connect(AC.destination);o.start();
    g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);
    o.stop(AC.currentTime+dur+0.02);
  }catch(e){}
}

function newGame(shop){
  const stock={};FIDS.forEach(id=>stock[id]=0);
  S={shop,fy:1,mi:0,cash:1500000,rep:20,stock,
     regs:["hochu","toki","hachimi","kami","rikkun"].map(f=>({f,nm:pick(SURN)})),
     loan:0,ad:false,yr:newYear(0),
     tot:{best:0,ok:0,miss:0,unsafe:0,redOk:0,redMiss:0,refer:0,n:0,yojo:0,listen:0},

function newYear(invBegin){return {invBegin,sales:0,salesServe:0,salesAuto:0,salesReg:0,purchase:0,rent:0,staff:0,util:0,misc:0,ad:0,interest:0,served:0};}
function invValue(){return FIDS.reduce((s,id)=>s+(S.stock[id]||0)*cost(id),0);}
function regCount(id){return S.regs.filter(r=>r.f===id).length;}
function curMonth(){return MONTHS[S.mi];}
function inSeason(cs,m){const sea=cs.sea||[];return !sea.length?1:(sea.includes(m)?3:0.15);}
function weightedPick(list,wfn){const w=list.map(wfn);let t=w.reduce((a,b)=>a+b,0),r=Math.random()*t;for(let i=0;i<list.length;i++){r-=w[i];if(r<=0)return list[i];}return list[list.length-1];}
function accuracy(){const t=S.tot;const n=t.best+t.ok+t.miss+t.unsafe;return n?(t.best+0.6*t.ok)/n:0.5;}

function updateHUD(){

function buildQueue(m){
  const q=[];const pool=CASES.slice();
  while(q.length<PER_MONTH&&pool.length){
    const c=weightedPick(pool,cs=>inSeason(cs,m)*(cs.red?0.45:1));
    q.push(CASES.indexOf(c));pool.splice(pool.indexOf(c),1);
  }
  return q;
}

function suggest(id){
  const f=F[id],m=curMonth();
  const seasonal=CASES.filter(cs=>!cs.red&&cs.best[0]===id).reduce((s,cs)=>s+inSeason(cs,m),0);
  const want=regCount(id)+Math.ceil(seasonal*(f.acute?1.2:0.8))+(f.acute?0:1);
  return Math.max(0,want-S.stock[id]);
}

function maybeFollow(){
  if(S.month.follow||!S.regs.length||Math.random()>0.5){S.month.follow=true;nextCustomer();return;}
  S.month.follow=true;
  const cands=[];S.regs.forEach(r=>FOLLOW.forEach(ev=>{if(ev.cond(r))cands.push({r,ev});}));
  if(!cands.length){nextCustomer();return;}
  const {r,ev}=pick(cands);
  if(!r.nm) r.nm=pick(SURN);
  const ch=shuffle(ev.ch);
  const render=()=>{
    panel.innerHTML=`
     <div class="speaker">経過確認 ─ 常連の${esc(r.nm)}さん（${F[r.f].n}を服用中）</div>

    panel.querySelectorAll(".item").forEach(b=>b.onclick=()=>{
      const c=ch[+b.dataset.i];S.rep=clamp(S.rep+c[1],0,100);

      if(c[1]>0){jingle([659,784,1047]);fx("評判+"+c[1],"#58d854",170,70);}else{jingle([330,262]);fx("評判"+c[1],"#fc7460",170,70);}
      const done=()=>{panel.innerHTML=`<div class="speaker">${c[1]>0?"よい対応！":"うーん…"}</div><div class="karte"><div>${esc(c[2])}</div></div>${lost}<div class="row"><button class="primary" id="f-next">店をあける ▶</button></div>`;

// ===== 判定 =====
function isRisky(cs,f){
  const r=cs.risk;if(!r)return false;
  return !!((r.kan&&f.kan)||(r.mao&&f.mao)||(r.dai&&f.dai)||(r.bushi&&f.bushi)||(r.ninpu&&(f.ninpu||f.dai||f.mao)));
}
function resolve(id,yojo){
  const cs=C.cs,t=S.tot;t.n++;S.yr.served++;
  let kind,rep=0,sale=0,repeat=false,head,body,pRep=0;
  const f=F[id];
  if(cs.red){
    if(id==="REFER"){kind="redOk";rep=5;head="◎ ナイス判断！";body="「すぐ病院に行ってみます。ありがとう！」";}
    else{kind="redMiss";rep=-10;S.stock[id]--;head="× 危険なサインを見のがした…";body="後日、そのお客さんは重い病気で入院したと聞いた…。";}
  }else if(id==="REFER"){
    kind="refer";head="△ 受診の必要はなかったかも";body="「病院に行くほどじゃないと思うんだけど…」お客さんは何も買わずに帰った。";
  }else{
    S.stock[id]--;
    if(isRisky(cs,f)){kind="unsafe";rep=-6;head="× 副作用・安全面の問題が…";body=`数日後「${cs.risk.mao&&f.mao?"動悸がして、具合が悪くなった":cs.risk.kan&&f.kan?"むくみと脱力感が出た":"産婦人科で、その漢方は妊娠中は避けてと言われた"}」と返品に来られた。持病・服用中の薬・妊娠の確認が大切！`;}
    else if(cs.best.includes(id)){kind="best";rep=f.acute?4:3;sale=priceOf(id);pRep=0.75+(hasEq("booth")?0.05:0);if(cs.risk)S.flags.safe=true;head="◎ ぴったりの処方！";body=f.acute?"「すごく楽になりました！ 家族にもすすめますね」":"「体が楽になってきました。また続けて買いに来ます！」";}
    else if(cs.ok.includes(id)){kind="ok";rep=1;sale=priceOf(id);pRep=0.35+(hasEq("booth")?0.05:0);head="○ まずまずの選択";body="「少しよくなった気がします」";}
    else{kind="miss";rep=-4;sale=priceOf(id);head="× 証が合っていなかった…";body="「あんまり効かなかったなあ…」お客さんは残念そうだ。";}
  }
  let yojoMsg="";
  if(yojo&&kind!=="unsafe"&&kind!=="redMiss"){
    if(yojo.v>0){rep+=1;pRep+=0.1;t.yojo++;S.yt.yojo=(S.yt.yojo||0)+1;yojoMsg=`<span class="good">養生◎</span> 体質に合った養生を、寄りそって伝えられた。`;}
    else if(yojo.v===0){pRep-=0.1;yojoMsg=`<span class="warn">養生△</span> 体質（${BYO[cs.byo].n}）に合わない養生だった。`;}
    else{rep-=1;pRep-=0.25;yojoMsg=`<span class="bad">養生×</span> 内容は合っていたが、上から目線の言い方でお客さんが萎縮してしまった。`;}
  }
  if(C.listen>0)pRep+=0.05;else if(C.listen<0)pRep-=0.1;
  repeat=sale>0&&!f.acute&&Math.random()<clamp(pRep,0,0.95);
  t[kind]++;S.yt[kind]=(S.yt[kind]||0)+1;
  S.rep=clamp(S.rep+rep,0,100);
  if(sale){S.cash+=sale;S.yr.sales+=sale;S.yr.salesServe+=sale;S.month.sales+=sale;}
  if(repeat) S.regs.push({f:id,nm:cs.nm.split(" ").pop().replace(/さん|くん/,"")});
  S.month.log.push({nm:cs.nm,kind,id,sale});
  S.month.served++;
  const good=kind==="best"||kind==="redOk"||kind==="ok";
  if(scene.cust)scene.cust.bubble=good?"heart":"sweat";
  if(good)jingle([659,784,1047]);else jingle([330,262,196]);
  if(sale)fx("+"+yen(sale),"#f8b800",150,86);
  if(rep)fx(`評判${rep>0?"+":""}${rep}`,rep>0?"#58d854":"#fc7460",170,70);
  const bestNames=cs.red?"受診勧奨":cs.best.map(b=>F[b].n).join("・")+(cs.ok.length?`（次点：${cs.ok.map(b=>F[b].n).join("・")}）`:"");
  const renderResult=()=>{panel.innerHTML=`
   <div class="speaker">${head}</div>
   <div class="msg">${esc(body)}</div>
   <div class="karte">
     <div><span class="k">あなたの選択</span>：${id==="REFER"?"受診をすすめる":F[id].n}　${sale?`<span class="warn">売上 ${yen(sale)}</span>`:""}${repeat?` <span class="good">★常連になった！</span>`:""}</div>
     ${yojoMsg?`<div>${yojoMsg}</div>`:""}
     <div><span class="k">正解</span>：${bestNames}</div>
     <div><span class="k">病態</span>：${BYO[cs.byo].n}</div>
     <div><span class="k">解説</span>：${esc(cs.ex)}</div>
   </div>
   <div class="row"><button class="primary" id="r-next">見送る ▶</button></div>`;
  $("#r-next").onclick=()=>{current=null;panel.innerHTML=`<div class="msg">ありがとうございました〜</div>`;custLeave(()=>nextCustomer());};
  };
  checkAch();
  show(renderResult);
}

// ===== 月末 =====
function monthEnd(){
  const m=curMonth(),Y=S.yr,M=S.month;
  const nAuto=4+Math.floor(S.rep/5)+(S.ad?4:0);
  const acc=accuracy();
  let autoSales=0,autoOk=0,autoLost=0,newRegs=0;
  const pool=CASES.filter(c=>!c.red);
  for(let i=0;i<nAuto;i++){
    const cs=weightedPick(pool,c=>inSeason(c,m));const id=cs.best[0];
    if(S.stock[id]<=0){autoLost++;continue;}
    S.stock[id]--;autoSales+=F[id].p;
    if(Math.random()<0.35+0.6*acc){autoOk++;if(!F[id].acute&&Math.random()<0.5){S.regs.push({f:id,nm:pick(SURN)});newRegs++;}}
    else S.rep=clamp(S.rep-0.5,0,100);
  }
  let regSales=0,regLeft=0,regOut=0;const keep=[];
  S.regs.forEach(r=>{
    if(Math.random()<0.04){regLeft++;return;}
    if(S.stock[r.f]>0){S.stock[r.f]--;regSales+=F[r.f].p;keep.push(r);}
    else{regOut++;}
  });
  S.regs=keep;S.rep=clamp(S.rep-regOut+Math.min(2,keep.length/20),0,100);
  const ad=S.ad?AD_COST:0;const interest=Math.round(S.loan*0.015/12);
  const fixed=FIXED.rent+FIXED.staff+FIXED.util+FIXED.misc+ad+interest;
  S.cash+=autoSales+regSales-fixed;
  Y.sales+=autoSales+regSales;Y.salesAuto+=autoSales;Y.salesReg+=regSales;
  Y.rent+=FIXED.rent;Y.staff+=FIXED.staff;Y.util+=FIXED.util;Y.misc+=FIXED.misc;Y.ad+=ad;Y.interest+=interest;
  const monthSales=M.sales+autoSales+regSales;
  const flow=monthSales-M.orderCost-fixed;
  let loanMsg="";
  if(S.cash<0){S.loan+=1000000;S.cash+=1000000;loanMsg=`<p class="bad">⚠ 資金がショート！ 銀行から ${yen(1000000)} を借り入れた（年利1.5%）。</p>`;}
  S.ad=false;
  if(autoSales+regSales){jingle([523,587,659,784]);fx("+"+yen(autoSales+regSales),"#f8b800",150,86);}
  const cnt=k=>M.log.filter(l=>l.kind===k).length;
  const renderEnd=()=>{panel.innerHTML=`
   <div class="speaker">${esc(S.shop)}　${S.fy}年目 ${m}月 ─ 月次レポート</div>
   <div class="scroll">
   <table>
    <tr><th colspan="2">売上</th></tr>
    <tr><td>接客での販売（${M.log.length}人）</td><td class="n">${yen(M.sales)}</td></tr>
    <tr><td>口コミ新規（${nAuto}人来店／満足${autoOk}人${autoLost?`／<span class="bad">欠品${autoLost}人</span>`:""}）</td><td class="n">${yen(autoSales)}</td></tr>
    <tr><td>常連さんのリピート（${keep.length}人）</td><td class="n">${yen(regSales)}</td></tr>
    <tr class="total"><td>今月の売上</td><td class="n">${yen(monthSales)}</td></tr>
    <tr><th colspan="2">支出</th></tr>
    <tr><td>仕入れ</td><td class="n minus">-${yen(M.orderCost)}</td></tr>
    <tr><td>家賃・人件費・光熱費・雑費</td><td class="n minus">-${yen(FIXED.rent+FIXED.staff+FIXED.util+FIXED.misc)}</td></tr>
    ${ad?`<tr><td>広告宣伝費</td><td class="n minus">-${yen(ad)}</td></tr>`:""}
    ${interest?`<tr><td>支払利息</td><td class="n minus">-${yen(interest)}</td></tr>`:""}
    <tr class="total"><td>今月の収支（現金ベース）</td><td class="n ${flow<0?"bad":"good"}">${yen(flow)}</td></tr>
   </table>
   <p class="small">接客結果：◎${cnt("best")+cnt("redOk")}　○${cnt("ok")}　×${cnt("miss")+cnt("unsafe")+cnt("redMiss")}　△${cnt("refer")}
   ／口コミから新しい常連 +${newRegs}人${regLeft?`／卒業・離脱 ${regLeft}人`:""}${regOut?`／<span class="bad">欠品で離れた常連 ${regOut}人</span>`:""}</p>
   <p class="small">在庫の評価額（原価）：${yen(invValue())}</p>
   ${loanMsg}
   ${regOut||autoLost?`<p class="warn small">ヒント：欠品は機会損失。常連さんが多い漢方は多めに仕入れよう。</p>`:""}
   </div>
   <div class="row"><button class="primary" id="e-next">${S.mi===11?"決算へ ▶":"次の月へ ▶"}</button></div>`;
  $("#e-next").onclick=()=>{if(S.mi===11){show(kessan);return;}S.mi++;show(monthStart);};
  };
  show(renderEnd);
}

// ===== 決算 =====
function kessan(){
  const Y=S.yr,endInv=invValue();
  const cogs=Y.invBegin+Y.purchase-endInv;
  const gross=Y.sales-cogs;
  const sga=Y.rent+Y.staff+Y.util+Y.ad+Y.misc;
  const op=gross-sga, ord=op-Y.interest;
  const tax=ord>0?Math.round(ord*0.3)+70000:70000;
  const net=ord-tax;
  const t=S.tot,accPct=Math.round(accuracy()*100);
  let title;
  if(net>=150000&&S.rep>=70) title="地域でたよられる漢方名人";
  else if(net>=0) title="黒字の堅実薬局";
  else if(S.rep>=60) title="評判は上々、経営は修行中";
  else title="まだまだ見習い薬剤師";
  jingle([523,659,784,1047,784,1047]);
  panel.innerHTML=`
   <div class="speaker">${esc(S.shop)}　${S.fy}年目 決算（4月〜翌3月）</div>
   <div class="scroll">
   <h2 class="center">称号「${title}」</h2>
   <h3>損益計算書</h3>
   <table>
    <tr><td>売上高</td><td class="n">${yen(Y.sales)}</td></tr>
    <tr class="sub"><td>　接客 ${yen(Y.salesServe)}／口コミ新規 ${yen(Y.salesAuto)}／常連 ${yen(Y.salesReg)}</td><td></td></tr>
    <tr><td>売上原価</td><td class="n minus">-${yen(cogs)}</td></tr>
    <tr class="sub"><td>　期首棚卸 ${yen(Y.invBegin)}＋当期仕入 ${yen(Y.purchase)}－期末棚卸 ${yen(endInv)}</td><td></td></tr>
    <tr class="total"><td>売上総利益（粗利）</td><td class="n">${yen(gross)}</td></tr>
    <tr><td>地代家賃</td><td class="n minus">-${yen(Y.rent)}</td></tr>
    <tr><td>給料手当</td><td class="n minus">-${yen(Y.staff)}</td></tr>
    <tr><td>水道光熱費</td><td class="n minus">-${yen(Y.util)}</td></tr>
    <tr><td>広告宣伝費</td><td class="n minus">-${yen(Y.ad)}</td></tr>
    <tr><td>雑費</td><td class="n minus">-${yen(Y.misc)}</td></tr>
    <tr class="total"><td>営業利益</td><td class="n ${op<0?"bad":"good"}">${yen(op)}</td></tr>
    <tr><td>支払利息</td><td class="n minus">-${yen(Y.interest)}</td></tr>
    <tr class="total"><td>経常利益</td><td class="n ${ord<0?"bad":"good"}">${yen(ord)}</td></tr>
    <tr><td>法人税等（赤字でも均等割 ${yen(70000)}）</td><td class="n minus">-${yen(tax)}</td></tr>
    <tr class="total"><td>当期純利益</td><td class="n ${net<0?"bad":"good"}">${yen(net)}</td></tr>
   </table>
   <h3>財産のようす（期末）</h3>
   <table>
    <tr><td>現金（税金支払前）</td><td class="n">${yen(S.cash)}</td></tr>
    <tr><td>棚卸資産（在庫）</td><td class="n">${yen(endInv)}</td></tr>
    <tr><td>借入金</td><td class="n ${S.loan?"bad":""}">${yen(S.loan)}</td></tr>
   </table>
   <h3>成績</h3>
   <p>接客 ${t.n}人　◎${t.best+t.redOk}　○${t.ok}　×${t.miss}　副作用・安全${t.unsafe}　見のがし${t.redMiss}<br>証の的中率 ${accPct}%　／ 聴き取り◎ ${t.listen}回　／ 養生◎ ${t.yojo}回　／ 評判 ${Math.round(S.rep)}　／ 常連 ${S.regs.length}人</p>
   </div>
   <div class="row">
     <button class="primary" id="k-next">${S.fy+1}年目へつづける ▶</button>

   </div>`;
  $("#k-next").onclick=()=>{S.cash-=tax;S.fy++;S.mi=0;S.yr=newYear(endInv);show(monthStart);};

// --- 補助 ---
function costRate(){return (S&&S.costRate)||COST_RATE;}
function hasEq(k){return !!(S&&S.eq&&S.eq[k]);}
function hasStaff(k){return !!(S&&S.staff&&S.staff.some(s=>s.k===k));}
function patBonus(){return (hasEq("booth")?1:0)+((S&&DIFF[S.diff])?DIFF[S.diff].pat:0);}
function priceOf(id){const f=F[id];return Math.round(f.p*(hasEq("senji")&&!f.acute?1.2:1));}
function fixedMul(){return (S&&DIFF[S.diff])?DIFF[S.diff].fixed:1;}
function fixedCosts(){const m=fixedMul();return {rent:Math.round(FIXED.rent*m),staff:Math.round(FIXED.staff*m),util:Math.round(FIXED.util*m),misc:Math.round(FIXED.misc*m)};}
function staffPay(){return S.staff.reduce((s,x)=>s+STAFF[x.k].pay,0);}
function eqBook(){return Object.values(S.eq).reduce((s,e)=>s+(e.price-e.dep),0);}
function yearAcc(){const t=S.yt;const n=(t.best||0)+(t.ok||0)+(t.miss||0)+(t.unsafe||0);return n?((t.best||0)+0.6*(t.ok||0))/n:0;}
function pickMissions(){return shuffle(MISSIONS).slice(0,3).map(m=>m.id);}
function migrate(s){
  s.diff=s.diff||"normal"; s.staff=s.staff||[]; s.eq=s.eq||{}; s.ach=s.ach||{}; s.flags=s.flags||{};
  s.costRate=s.costRate||COST_RATE; s.capital=s.capital||1500000; s.yt=s.yt||{};
  s.missions=s.missions||pickMissions(); s.tot.yojo=s.tot.yojo||0; s.tot.listen=s.tot.listen||0;
  ["dep","other","hire"].forEach(k=>{if(s.yr[k]==null)s.yr[k]=0;});
  return s;
}

}

// --- 月のはじめ（出来事つき） ---
function buildQueue(m){
  const q=[];const pool=CASES.slice();const n=PER_MONTH-((S.month&&S.month.fewer)||0);
  while(q.length<n&&pool.length){
    const c=weightedPick(pool,cs=>inSeason(cs,m)*(cs.red?0.45:1)*(S.month&&S.month.flu&&cs.best&&cs.best.some(b=>F[b].cat==="hyo"||F[b].acute)?2.5:1));
    q.push(CASES.indexOf(c));pool.splice(pool.indexOf(c),1);
  }
  return q;
}
function monthStart(){
  migrate(S);
  const m=curMonth();
  if(!S.month||S.month.key!==S.fy+"-"+S.mi){
    S.month={key:S.fy+"-"+S.mi,served:0,queue:[],log:[],sales:0,orderCost:0,follow:false,ev:null,evDone:false,trained:false};
    // 出来事（最初の月はなし）
    if(!(S.fy===1&&S.mi===0)&&Math.random()<0.5){
      const cands=RANDOM_EVENTS.filter(e=>e.cond());
      if(cands.length){const e=pick(cands);S.month.ev=e.id;if(!e.choice){e.apply();S.month.evDone=true;}}
    }
    S.month.queue=buildQueue(m);
    save();
  }
  const ev=S.month.ev?RANDOM_EVENTS.find(e=>e.id===S.month.ev):null;
  const fc=fixedCosts();
  panel.innerHTML=`
   <div class="speaker">${esc(S.shop)}　${S.fy}年目 ${m}月 ─ できごと</div>
   <div class="msg" id="m-msg"></div>
   ${ev?`<div class="karte"><div class="warn">★ ${esc(ev.text)}</div>${ev.choice&&!S.month.evDone?`<div class="row"><button class="primary" id="ev-yes">${ev.choice.yes}</button><button id="ev-no">${ev.choice.no}</button></div>`:""}</div>`:""}
   <div class="small">固定費：家賃 ${yen(fc.rent)}／人件費 ${yen(fc.staff+staffPay())}／光熱 ${yen(fc.util)}／雑費 ${yen(fc.misc)}${S.loan?`／借入利息あり`:""}　原価率 ${Math.round(costRate()*100)}%${S.rival?"　<span class='bad'>ライバル店あり</span>":""}</div>
   <div class="row"><button id="b-keiei">経営メニュー（スタッフ・設備）</button><button id="b-goal">今年の目標</button><button class="primary" id="b-order" ${ev&&ev.choice&&!S.month.evDone?"disabled":""}>仕入れをする ▶</button></div>`;
  typeInto($("#m-msg"),EVENTS[m]+(S.mi===0&&S.fy===1?`\n\n「${S.shop}」開業！ 前の店主から常連さんを5人引きついだ。まずは漢方の在庫を仕入れよう。`:""));
  if(ev&&ev.choice&&!S.month.evDone){
    $("#ev-yes").onclick=()=>{const c=ev.choice;if(S.cash<c.cost){fx("お金が足りない","#fc7460");return;}
      S.cash-=c.cost;S.yr.other+=c.cost;S.rep=clamp(S.rep+c.rep,0,100);
      if(c.train)S.staff.forEach(s=>s.skill=Math.min(0.9,s.skill+c.train));
      S.month.evDone=true;fx("評判+"+c.rep,"#58d854",170,70);jingle([659,784,1047]);save();show(monthStart);};
    $("#ev-no").onclick=()=>{S.month.evDone=true;save();show(monthStart);};
  }
  $("#b-keiei").onclick=()=>show(keieiScreen);
  $("#b-goal").onclick=()=>show(goalScreen);
  $("#b-order").onclick=()=>show(orderScreen);
}

// --- 経営メニュー ---
let keieiTab="staff";
function keieiScreen(){
  const tabs=`<div class="tabs" id="k-tabs">${[["staff","スタッフ"],["equip","設備"]].map(([k,l])=>`<button class="${k===keieiTab?"on":""}" data-k="${k}">${l}</button>`).join("")}</div>`;
  let body="";
  if(keieiTab==="staff"){
    body=`<p class="small">口コミで来る新規のお客さんは、店主だけだと月${OWNER_CAP}人までしか対応できません。評判が上がったらスタッフを増やそう（採用費 ${yen(HIRE_COST)}）。</p>
     <div class="list">${Object.entries(STAFF).map(([k,st])=>{const hired=S.staff.find(s=>s.k===k);
       return `<div class="order-row" style="grid-template-columns:1fr auto">
         <div>${st.n}　<span class="small">月給 ${yen(st.pay)}${hired&&st.skill?`／対応力 ${Math.round(hired.skill*100)}`:""}</span><div class="small">${st.d}</div></div>
         ${hired?`<button data-fire="${k}" class="danger">やめてもらう</button>`:`<button data-hire="${k}" class="primary" ${S.cash<HIRE_COST?"disabled":""}>採用する</button>`}
       </div>`;}).join("")}</div>
     <div class="row"><button id="k-train" ${!S.staff.some(s=>STAFF[s.k].skill)||S.month.trained||S.cash<TRAIN_COST?"disabled":""}>スタッフ研修（${yen(TRAIN_COST)}・対応力+5）${S.month.trained?"／今月は実施済み":""}</button></div>`;
  }else{
    body=`<p class="small">設備は買った月から5年かけて費用にします（減価償却）。決算書の「設備」にのります。</p>
     <div class="list">${Object.entries(EQUIP).map(([k,e])=>`<div class="order-row" style="grid-template-columns:1fr auto">
       <div>${e.n}　<span class="small">${yen(e.price)}</span><div class="small">${e.d}</div></div>
       ${S.eq[k]?`<span class="good small">導入済み</span>`:`<button data-buy="${k}" class="primary" ${S.cash<e.price?"disabled":""}>導入する</button>`}
     </div>`).join("")}</div>`;
  }
  panel.innerHTML=`<div class="speaker">経営メニュー　<span class="small">現金 ${yen(S.cash)}</span></div>${tabs}${body}<div class="row"><button id="k-back">◀ もどる</button></div>`;
  panel.querySelectorAll("#k-tabs button").forEach(b=>b.onclick=()=>{keieiTab=b.dataset.k;keieiScreen();});
  panel.querySelectorAll("[data-hire]").forEach(b=>b.onclick=()=>{const k=b.dataset.hire;S.cash-=HIRE_COST;S.yr.hire+=HIRE_COST;S.staff.push({k,skill:STAFF[k].skill});jingle([523,659,784]);fx(STAFF[k].n+"を採用！","#58d854",150,70);checkAch();save();keieiScreen();updateHUD();});
  panel.querySelectorAll("[data-fire]").forEach(b=>b.onclick=()=>{const k=b.dataset.fire;S.staff=S.staff.filter(s=>s.k!==k);beep(330,.1);save();keieiScreen();});
  panel.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{const k=b.dataset.buy;const e=EQUIP[k];S.cash-=e.price;S.eq[k]={price:e.price,dep:0};jingle([523,659,784,1047]);fx(e.n+"を導入！","#58d854",150,70);checkAch();save();keieiScreen();updateHUD();});
  const tr=$("#k-train");if(tr)tr.onclick=()=>{S.cash-=TRAIN_COST;S.yr.other+=TRAIN_COST;S.month.trained=true;S.staff.forEach(s=>{if(STAFF[s.k].skill)s.skill=Math.min(0.9,s.skill+0.05);});jingle([659,784]);save();keieiScreen();updateHUD();};
  $("#k-back").onclick=()=>show(monthStart);
}

// --- 今年の目標・実績 ---
function goalScreen(){
  const back=current===goalScreen?monthStart:current;
  panel.innerHTML=`<div class="speaker">${S.fy}年目の目標（決算で達成していれば評判+3ずつ）</div>
   <div class="karte">${S.missions.map(id=>{const m=MISSIONS.find(x=>x.id===id);return `<div>□ ${m.n}</div>`;}).join("")}</div>
   <div class="row"><button id="g-back">◀ もどる</button></div>`;
  $("#g-back").onclick=()=>show(monthStart);
}
function openAch(){
  const back=current;
  const got=S?Object.keys(S.ach).length:0;
  panel.innerHTML=`<div class="speaker">実績 ${got}／${ACH.length}</div>
   <div class="scroll">${ACH.map(a=>{const d=S&&S.ach[a.id];return `<div class="karte" style="${d?"":"opacity:.5"}"><div>${d?"★":"☆"} <b class="${d?"warn":""}" style="font-weight:normal">${a.n}</b>　<span class="small">${a.d}${d?`（${d}）`:""}</span></div></div>`;}).join("")}
   ${S?`<h3>${S.fy}年目の目標</h3><div class="karte">${S.missions.map(id=>`<div>□ ${MISSIONS.find(x=>x.id===id).n}</div>`).join("")}</div>`:""}</div>
   <div class="row"><button id="a-close">とじる</button></div>`;
  $("#a-close").onclick=()=>back?show(back):show(titleScreen);
}

// --- 月末（スタッフ・設備・ライバル・減価償却） ---
function monthEnd(){
  const m=curMonth(),Y=S.yr,M=S.month;
  let demand=4+Math.floor(S.rep/5)+(S.ad?4:0)+(hasEq("sign")?3:0)+(M.bonus||0);
  if(S.rival) demand-=S.rep>=60?1:3;
  demand=Math.max(0,demand);
  const acc=accuracy();
  // 対応できる人：店主→スタッフの順
  const handlers=[{n:OWNER_CAP,skill:0.35+0.6*acc}];
  S.staff.forEach(s=>{const st=STAFF[s.k];if(st.cap)handlers.push({n:st.cap,skill:s.skill});});
  let autoSales=0,autoOk=0,autoLost=0,newRegs=0,overflow=0,served=0;
  const pool=CASES.filter(c=>!c.red);
  for(let i=0;i<demand;i++){
    let h=handlers.find(x=>x.n>0);
    if(!h){overflow++;continue;}
    const cs=weightedPick(pool,c=>inSeason(c,m)*(M.flu&&c.best.some(b=>F[b].acute)?2.5:1));const id=cs.best[0];
    if(S.stock[id]<=0){autoLost++;continue;}
    h.n--;served++;
    S.stock[id]--;autoSales+=priceOf(id);
    if(Math.random()<h.skill){autoOk++;if(!F[id].acute&&Math.random()<0.5+(hasEq("booth")?0.05:0)){S.regs.push({f:id,nm:pick(SURN)});newRegs++;}}
    else S.rep=clamp(S.rep-0.5,0,100);
  }
  if(overflow)S.rep=clamp(S.rep-Math.min(3,overflow*0.3),0,100);
  // 常連さん
  let regSales=0,regLeft=0,regOut=0,autoBuy=0;const keep=[];
  const churn=Math.max(0.01,0.04-(hasStaff("yakuzai")?0.02:0));
  S.regs.forEach(r=>{
    if(Math.random()<churn){regLeft++;return;}
    if(S.stock[r.f]<=0&&hasEq("pos")){const c=cost(r.f);S.cash-=c;Y.purchase+=c;S.stock[r.f]++;autoBuy++;}
    if(S.stock[r.f]>0){S.stock[r.f]--;regSales+=priceOf(r.f);keep.push(r);}
    else if(hasStaff("jimu")&&Math.random()<0.5){keep.push(r);}
    else regOut++;
  });
  S.regs=keep;S.rep=clamp(S.rep-regOut+Math.min(2,keep.length/20),0,100);
  // 支払い
  const fc=fixedCosts(),pay=staffPay();
  const ad=S.ad?AD_COST:0;const interest=Math.round(S.loan*0.015/12);
  let dep=0;Object.values(S.eq).forEach(e=>{const d=Math.min(Math.round(e.price/60),e.price-e.dep);e.dep+=d;dep+=d;});
  const cashOut=fc.rent+fc.staff+pay+fc.util+fc.misc+ad+interest;
  S.cash+=autoSales+regSales-cashOut;
  Y.sales+=autoSales+regSales;Y.salesAuto+=autoSales;Y.salesReg+=regSales;
  Y.rent+=fc.rent;Y.staff+=fc.staff+pay;Y.util+=fc.util;Y.misc+=fc.misc;Y.ad+=ad;Y.interest+=interest;Y.dep+=dep;
  const monthSales=M.sales+autoSales+regSales;
  const flow=monthSales-M.orderCost-cashOut;
  let loanMsg="";
  if(S.cash<0){S.loan+=1000000;S.cash+=1000000;loanMsg=`<p class="bad">⚠ 資金がショート！ 銀行から ${yen(1000000)} を借り入れた（年利1.5%）。</p>`;}
  S.ad=false;
  checkAch();
  if(autoSales+regSales){jingle([523,587,659,784]);fx("+"+yen(autoSales+regSales),"#f8b800",150,86);}
  const cnt=k=>M.log.filter(l=>l.kind===k).length;
  const renderEnd=()=>{panel.innerHTML=`
   <div class="speaker">${esc(S.shop)}　${S.fy}年目 ${m}月 ─ 月次レポート</div>
   <div class="scroll">
   <table>
    <tr><th colspan="2">売上</th></tr>
    <tr><td>接客での販売（${M.log.length}人）</td><td class="n">${yen(M.sales)}</td></tr>
    <tr><td>口コミ新規（来店${demand}人／対応${served}人・満足${autoOk}人${autoLost?`／<span class="bad">欠品${autoLost}人</span>`:""}${overflow?`／<span class="bad">手が回らず${overflow}人帰った</span>`:""}）</td><td class="n">${yen(autoSales)}</td></tr>
    <tr><td>常連さんのリピート（${keep.length}人）</td><td class="n">${yen(regSales)}</td></tr>
    <tr class="total"><td>今月の売上</td><td class="n">${yen(monthSales)}</td></tr>
    <tr><th colspan="2">支出</th></tr>
    <tr><td>仕入れ${autoBuy?`（自動取り寄せ${autoBuy}箱を含む）`:""}</td><td class="n minus">-${yen(M.orderCost)}</td></tr>
    <tr><td>家賃・光熱費・雑費</td><td class="n minus">-${yen(fc.rent+fc.util+fc.misc)}</td></tr>
    <tr><td>人件費${pay?`（スタッフ${S.staff.length}人を含む）`:""}</td><td class="n minus">-${yen(fc.staff+pay)}</td></tr>
    ${ad?`<tr><td>広告宣伝費</td><td class="n minus">-${yen(ad)}</td></tr>`:""}
    ${interest?`<tr><td>支払利息</td><td class="n minus">-${yen(interest)}</td></tr>`:""}
    <tr class="total"><td>今月の収支（現金ベース）</td><td class="n ${flow<0?"bad":"good"}">${yen(flow)}</td></tr>
   </table>
   ${dep?`<p class="small">設備の減価償却費 ${yen(dep)}（現金は出ないが、決算で費用になる）</p>`:""}
   <p class="small">接客結果：◎${cnt("best")+cnt("redOk")}　○${cnt("ok")}　×${cnt("miss")+cnt("unsafe")+cnt("redMiss")}　△${cnt("refer")}
   ／口コミから新しい常連 +${newRegs}人${regLeft?`／卒業・離脱 ${regLeft}人`:""}${regOut?`／<span class="bad">欠品で離れた常連 ${regOut}人</span>`:""}</p>
   <p class="small">在庫の評価額（原価）：${yen(invValue())}</p>
   ${loanMsg}
   ${overflow?`<p class="warn small">ヒント：評判が上がって手が回らなくなってきた。経営メニューでスタッフの採用を考えよう。</p>`:""}
   ${regOut||autoLost?`<p class="warn small">ヒント：欠品は機会損失。常連さんが多い漢方は多めに仕入れよう。</p>`:""}
   </div>
   <div class="row"><button class="primary" id="e-next">${S.mi===11?"決算へ ▶":"次の月へ ▶"}</button></div>`;
  $("#e-next").onclick=()=>{if(S.mi===11){show(kessan);return;}S.mi++;show(monthStart);};
  };
  show(renderEnd);
}

// --- 決算（損益計算書＋貸借対照表＋今年の目標） ---
function kessan(){
  const Y=S.yr,endInv=invValue();
  const cogs=Y.invBegin+Y.purchase-endInv;
  const gross=Y.sales-cogs;
  const sga=Y.rent+Y.staff+Y.util+Y.ad+Y.misc+Y.dep+Y.other+Y.hire;
  const op=gross-sga, ord=op-Y.interest;
  const tax=ord>0?Math.round(ord*0.3)+70000:70000;
  const net=ord-tax;
  if(!S.month.kessanDone){
    S.month.kessanDone=true;
    if(net>0)S.flags.black=true;
    if(S.loan===0)S.flags.noloanKessan=true;
    S.month.missionRes=S.missions.map(id=>{const m=MISSIONS.find(x=>x.id===id);const ok=!!m.c(net);if(ok)S.rep=clamp(S.rep+3,0,100);return [m.n,ok];});
    checkAch();
  }
  const t=S.tot,accPct=Math.round(yearAcc()*100);
  let title;
  if(net>=150000&&S.rep>=70) title="地域でたよられる漢方名人";
  else if(net>=0) title="黒字の堅実薬局";
  else if(S.rep>=60) title="評判は上々、経営は修行中";
  else title="まだまだ見習い薬剤師";
  jingle([523,659,784,1047,784,1047]);
  // 貸借対照表
  const book=eqBook();
  const assets=S.cash+endInv+book, liab=S.loan+tax, retained=assets-liab-S.capital;
  const row=(l,v,c="")=>`<tr><td>${l}</td><td class="n ${c}">${yen(v)}</td></tr>`;
  panel.innerHTML=`
   <div class="speaker">${esc(S.shop)}　${S.fy}年目 決算（4月〜翌3月）　難易度：${DIFF[S.diff].n}</div>
   <div class="scroll">
   <h2 class="center">称号「${title}」</h2>
   <h3>今年の目標</h3>
   <div class="karte">${S.month.missionRes.map(([n,ok])=>`<div class="${ok?"good":"small"}">${ok?"■ 達成！ 評判+3":"□ 未達成"}　${n}</div>`).join("")}</div>
   <h3>損益計算書（P/L）</h3>
   <table>
    ${row("売上高",Y.sales)}
    <tr class="sub"><td>　接客 ${yen(Y.salesServe)}／口コミ新規 ${yen(Y.salesAuto)}／常連 ${yen(Y.salesReg)}</td><td></td></tr>
    ${row("売上原価",-cogs,"minus")}
    <tr class="sub"><td>　期首棚卸 ${yen(Y.invBegin)}＋当期仕入 ${yen(Y.purchase)}－期末棚卸 ${yen(endInv)}</td><td></td></tr>
    <tr class="total"><td>売上総利益（粗利）</td><td class="n">${yen(gross)}</td></tr>
    ${row("地代家賃",-Y.rent,"minus")}
    ${row("給料手当",-Y.staff,"minus")}
    ${row("水道光熱費",-Y.util,"minus")}
    ${row("広告宣伝費",-Y.ad,"minus")}
    ${Y.hire?row("採用費",-Y.hire,"minus"):""}
    ${Y.other?row("研修・販促費",-Y.other,"minus"):""}
    ${Y.dep?row("減価償却費",-Y.dep,"minus"):""}
    ${row("雑費",-Y.misc,"minus")}
    <tr class="total"><td>営業利益</td><td class="n ${op<0?"bad":"good"}">${yen(op)}</td></tr>
    ${row("支払利息",-Y.interest,"minus")}
    <tr class="total"><td>経常利益</td><td class="n ${ord<0?"bad":"good"}">${yen(ord)}</td></tr>
    ${row(`法人税等（赤字でも均等割 ${yen(70000)}）`,-tax,"minus")}
    <tr class="total"><td>当期純利益</td><td class="n ${net<0?"bad":"good"}">${yen(net)}</td></tr>
   </table>
   <h3>貸借対照表（B/S・期末）</h3>
   <table>
    <tr><th colspan="2">資産の部</th></tr>
    ${row("現金",S.cash)}
    ${row("棚卸資産（在庫）",endInv)}
    ${book?row("設備（帳簿価額）",book):""}
    <tr class="total"><td>資産合計</td><td class="n">${yen(assets)}</td></tr>
    <tr><th colspan="2">負債の部</th></tr>
    ${row("借入金",S.loan,S.loan?"bad":"")}
    ${row("未払法人税等",tax)}
    <tr class="total"><td>負債合計</td><td class="n">${yen(liab)}</td></tr>
    <tr><th colspan="2">純資産の部</th></tr>
    ${row("資本金",S.capital)}
    ${row("利益剰余金（これまでの利益の積み上げ）",retained,retained<0?"bad":"")}
    <tr class="total"><td>負債・純資産合計</td><td class="n">${yen(liab+S.capital+retained)}</td></tr>
   </table>
   <p class="small">資産合計と「負債・純資産合計」は必ず同じ金額になります（左右が釣り合うので「バランスシート」）。</p>
   <h3>成績</h3>
   <p>接客 ${t.n}人　◎${t.best+t.redOk}　○${t.ok}　×${t.miss}　副作用・安全${t.unsafe}　見のがし${t.redMiss}<br>今年の的中率 ${accPct}%　／ 聴き取り◎ ${t.listen}回　／ 養生◎ ${t.yojo}回　／ 評判 ${Math.round(S.rep)}　／ 常連 ${S.regs.length}人　／ スタッフ ${S.staff.length}人　／ 実績 ${Object.keys(S.ach).length}/${ACH.length}</p>
   </div>
   <div class="row">
     <button class="primary" id="k-next">${S.fy+1}年目へつづける ▶</button>
     <button id="k-title">タイトルへ</button>
   </div>`;
  $("#k-next").onclick=()=>{S.cash-=tax;S.fy++;S.mi=0;S.yr=newYear(endInv);S.yt={};S.missions=pickMissions();checkAch();show(monthStart);};
  $("#k-title").onclick=()=>{clearSave();S=null;updateHUD();show(titleScreen);};
}
$("#btn-ach").onclick=()=>{beep(700,.04);openAch();};
// ===== 起動 =====
paintBG();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(paintBG);
setTimeout(paintBG,1500);
requestAnimationFrame(frame);
updateHUD();
show(titleScreen);

if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
</script>
</body>
</html>
